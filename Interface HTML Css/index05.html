<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting</title>
</head>
<body>
    <h1>Testando Formatação de Fonte</h1>
    <p><b> em negrito</b></p>
    <p><i>Texto itálico</i></p>
    <p>Text <sub>subscript</sub> == 2</p>
    <p>Texto Superscript</p>
    <p><strong>importante</strong></p>
    <p>Texto <del>Superscript</del> Deletado</p>
    <p><small>Texto pequeno</small></p>
    <p>Texto <mark>Marcado</mark>!</p>
</body>
</html>
